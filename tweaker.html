<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML 조절기 — 고친 걸 그대로 Claude에게</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecef;--panel:#fff;--ink:#1d2430;--sub:#5d6877;--line:#cfd6dd;--pick:#2f6bff;--code:#f3f5f7;--warn:#c2410c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1e24;--panel:#242a32;--ink:#e6eaef;--sub:#9aa5b2;--line:#3a424d;--pick:#6c95ff;--code:#1d2229;--warn:#fb923c}}
:root[data-theme="dark"]{--bg:#1a1e24;--panel:#242a32;--ink:#e6eaef;--sub:#9aa5b2;--line:#3a424d;--pick:#6c95ff;--code:#1d2229;--warn:#fb923c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);height:100%;gap:0}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr) 220px}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:1rem;margin:0 12px 0 0}
header .hint{color:var(--sub);font-size:.82rem}
.stage{padding:14px;min-height:0}
iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
aside{background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto}
h2{font-size:.9rem;margin:0 0 4px}
.sel{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--sub);word-break:break-all;margin-bottom:12px}
.group{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.group[hidden]{display:none}
.row{display:grid;grid-template-columns:72px 1fr 56px;align-items:center;gap:8px;margin-bottom:8px;font-size:.82rem}
.row output{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.row input[type=color]{width:100%;height:26px;border:1px solid var(--line);border-radius:4px;background:none}
textarea{width:100%;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--code);color:var(--ink);resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button,.filebtn{font:inherit;font-size:.82rem;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.main{background:var(--pick);border-color:var(--pick);color:#fff}
button.danger{color:var(--warn);border-color:var(--warn)}
button:focus-visible,.filebtn:focus-within{outline:2px solid var(--pick);outline-offset:2px}
.filebtn input{display:none}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.76rem;white-space:pre-wrap;word-break:break-all;min-height:80px;max-height:260px;overflow:auto;margin:10px 0}
.toast{font-size:.78rem;color:var(--pick);min-height:1.2em;margin-top:6px}
.empty{color:var(--sub);font-size:.85rem}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>HTML 조절기</h1>
    <label class="filebtn">HTML 파일 열기<input type="file" id="openHtml" accept=".html,.htm"></label>
    <button id="loadSample">예시 페이지</button>
    <span class="hint">페이지 안 요소를 클릭 → 오른쪽에서 조절 → 드래그로 위치 이동. 원본 파일은 안 바뀝니다.</span>
  </header>

  <div class="stage"><iframe id="view" title="편집할 페이지"></iframe></div>

  <aside>
    <h2 id="selName">요소를 클릭하세요</h2>
    <div class="sel" id="selPath"></div>

    <div class="group" id="gText" hidden>
      <h2>글자</h2>
      <div id="textControls"></div>
      <label class="row" style="grid-template-columns:72px 1fr"><span>문구</span><textarea id="textEdit" rows="2"></textarea></label>
    </div>

    <div class="group" id="gImg" hidden>
      <h2>이미지</h2>
      <div id="imgControls"></div>
      <div class="btns">
        <label class="filebtn">이미지 교체<input type="file" id="swapImg" accept="image/*"></label>
      </div>
    </div>

    <div class="group" id="gBox" hidden>
      <h2>위치</h2>
      <div id="boxControls"></div>
      <div class="btns">
        <label class="filebtn">아래에 이미지 추가<input type="file" id="addImg" accept="image/*"></label>
        <button class="danger" id="del">이 요소 삭제</button>
      </div>
    </div>

    <div class="group">
      <h2>Claude에게 보낼 수정 요청</h2>
      <pre id="out" class="empty">아직 바꾼 게 없어요.</pre>
      <div class="btns">
        <button class="main" id="copy">복사</button>
        <button id="reset">전부 되돌리기</button>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </aside>
</div>

<script>
const SAMPLE = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자분뽀 웹툰</title>
<style>
/* ===================== CSS : 보이는 모습 ===================== */
* { box-sizing: border-box; }
body { margin: 0; background: #e0e0e0; font-family: sans-serif; color: #333; }

/* 휴대폰 화면 크기로 가운데 고정 */
.app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: #f5f5f5; padding-bottom: 80px; position: relative; }

/* 상단바 */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #ffffff; }
.logo { font-size: 20px; font-weight: 700; color: #333; }
.search { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #999; }

/* 이벤트 배너 */
.banner { position: relative; margin: 16px 20px; border-radius: 8px; overflow: hidden; }
.banner-img { width: 100%; height: 190px; object-fit: cover; display: block; }
.banner-text { position: absolute; left: 20px; bottom: 20px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; background: #ffffff; color: #555; padding: 4px 8px; border-radius: 4px; animation: float 2s infinite; position: relative; left: 291px; top: -6px; }
.banner-title { font-size: 24px; font-weight: 700; color: #424d46; margin: 8px 0 4px; position: relative; top: -44px; }
.banner-sub { font-size: 14px; color: #808080; margin: 0 0 12px; font-weight: 600; letter-spacing: 4px; }

/* 버튼 */
.btn { font-size: 14px; font-weight: 700; padding: 10px 18px; border: none; border-radius: 4px; background: #777777; color: #ffffff; cursor: pointer; transition: all 0.3s; }
.btn:hover { background: #555555; transform: scale(1.05); }

/* 섹션 제목 */
.section-title { font-size: 18px; font-weight: 700; margin: 24px 20px 12px; }

/* 요일 탭 */
.days { display: flex; gap: 6px; padding: 0 20px; }
.day { flex: 1; font-size: 14px; padding: 8px 0; border: 1px solid #ccc; border-radius: 4px; background: #ffffff; color: #666; cursor: pointer; }
.day.active { background: #777777; color: #ffffff; border-color: #777777; }

/* 작품 카드 (가로 스크롤) */
.cards { display: flex; gap: 12px; padding: 12px 20px; overflow-x: auto; }
.card { flex: 0 0 120px; }
.card-img { width: 120px; height: 160px; object-fit: cover; border-radius: 6px; display: block; }
.card-title { font-size: 14px; font-weight: 700; margin: 8px 0 2px; }
.card-genre { font-size: 12px; color: #888; }
.like { margin-top: 6px; font-size: 12px; padding: 4px 8px; border: 1px solid #aaa; border-radius: 4px; background: #fff; color: #666; cursor: pointer; }
.like.on { background: #555; color: #fff; border-color: #555; }

/* 하단 탭바 */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; display: flex; background: #ffffff; border-top: 1px solid #ddd; }
.tab { flex: 1; text-align: center; font-size: 12px; padding: 14px 0; color: #999; }
.tab.active { color: #333; font-weight: 700; }

/* 토스트 알림 */
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #333; color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

/* 애니메이션 : 둥실둥실 */
@keyframes float {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-4px); }
  100% { transform: translateY(0); }
}
</style>
</head>
<body>
<!-- ===================== HTML : 뭐가 있는지 ===================== -->
<div class="app">

  <header class="topbar">
    <div class="logo">자분뽀 웹툰</div>
    <div class="search"></div>
  </header>

  <section class="banner">
    <img class="banner-img" src="images/banner-custom.jpg" alt="이벤트 배너">
    <div class="banner-text">
      <span class="badge">EVENT</span>
      <h2 class="banner-title">집에 가고 싶음.....</h2>
      <p class="banner-sub">12개월 내내.............</p>
      <button class="btn" id="bannerBtn">지금 집에 가기</button>
    </div>
  </section>

  <h3 class="section-title">요일별 웹툰</h3>
  <div class="days" id="days">
    <button class="day active" data-day="mon">월</button>
    <button class="day" data-day="tue">화</button>
    <button class="day" data-day="wed">수</button>
    <button class="day" data-day="thu">목</button>
    <button class="day" data-day="fri">금</button>
  </div>
  <div class="cards" id="cards"></div>

</div>

<nav class="tabbar">
  <div class="tab active">홈</div>
  <div class="tab">요일</div>
  <div class="tab">보관함</div>
  <div class="tab">MY</div>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ===================== JS : 어떻게 반응하는지 ===================== */

// 가짜 작품 데이터 (나중엔 서버에서 받아오는 부분)
const works = {
  mon: [{t:'작품 A', g:'로맨스', img:'cover-a.png'}, {t:'작품 B', g:'판타지', img:'cover-b.jpg'}, {t:'작품 C', g:'드라마', img:'cover-c.jpg'}],
  tue: [{t:'작품 D', g:'액션',   img:'cover4.svg'}, {t:'작품 E', g:'로맨스', img:'cover5.svg'}],
  wed: [{t:'작품 F', g:'스릴러', img:'cover6.svg'}, {t:'작품 A', g:'로맨스', img:'cover-a.png'}, {t:'작품 D', g:'액션', img:'cover4.svg'}],
  thu: [{t:'작품 B', g:'판타지', img:'cover-b.jpg'}, {t:'작품 E', g:'로맨스', img:'cover5.svg'}],
  fri: [{t:'작품 C', g:'드라마', img:'cover-c.jpg'}, {t:'작품 F', g:'스릴러', img:'cover6.svg'}, {t:'작품 B', g:'판타지', img:'cover-b.jpg'}]
};

// 카드 목록 그리기 : JS가 HTML을 갈아끼우는 부분
function showCards(day) {
  document.getElementById('cards').innerHTML = works[day].map(w => \`
    <div class="card">
      <img class="card-img" src="images/\${w.img}" alt="\${w.t}">
      <div class="card-title">\${w.t}</div>
      <div class="card-genre">\${w.g}</div>
      <button class="like">♡ 찜</button>
    </div>\`).join('');
}

// 토스트 알림 띄우기
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

// 요일 탭 누르면 : 버튼 색 바꾸고 목록 바꾸기
document.getElementById('days').addEventListener('click', e => {
  if (!e.target.dataset.day) return;
  document.querySelectorAll('.day').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  showCards(e.target.dataset.day);
});

// 찜 버튼 누르면 : 켜고 끄기 + 알림
document.getElementById('cards').addEventListener('click', e => {
  if (!e.target.classList.contains('like')) return;
  const on = e.target.classList.toggle('on');
  e.target.textContent = on ? '♥ 찜' : '♡ 찜';
  toast(on ? '찜했어요' : '찜 해제했어요');
});

// 배너 버튼
document.getElementById('bannerBtn').addEventListener('click', () => toast('이벤트 페이지 준비 중이에요'));

showCards('mon');
<\/script>
</body>
</html>`;

const TEXT_PROPS = [
  {k:'font-size',label:'크기',min:8,max:120,step:1,unit:'px'},
  {k:'font-weight',label:'굵기',min:100,max:900,step:100,unit:''},
  {k:'letter-spacing',label:'자간',min:-5,max:10,step:0.5,unit:'px'},
  {k:'line-height',label:'줄 간격',min:0.8,max:2.5,step:0.05,unit:''},
  {k:'color',label:'색',type:'color'}
];
const IMG_PROPS = [
  {k:'width',label:'너비',min:20,max:1200,step:1,unit:'px'},
  {k:'height',label:'높이',min:20,max:1200,step:1,unit:'px'},
  {k:'border-radius',label:'모서리',min:0,max:200,step:1,unit:'px'},
  {k:'opacity',label:'투명도',min:0,max:1,step:0.05,unit:''}
];
const BOX_PROPS = [
  {k:'left',label:'가로 이동',min:-600,max:600,step:1,unit:'px'},
  {k:'top',label:'세로 이동',min:-600,max:600,step:1,unit:'px'}
];

const $ = id => document.getElementById(id);
const view = $('view');
let doc, cur, fileName = 'index.html';
let orig = new Map();          // element -> 원래 computed 값
let ops = [];                  // 문구/이미지/삭제/추가 기록

function withBase(html){
  const base = '<base href="' + location.href + '">';
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + base) : base + html;
}

function load(html, name){
  fileName = name || 'index.html';
  orig = new Map(); ops = []; cur = null;
  view.srcdoc = withBase(html);
  view.onload = setup;
}

function setup(){
  doc = view.contentDocument;
  const st = doc.createElement('style');
  st.textContent = '[data-tw-hover]{outline:1px dashed #2f6bff!important;outline-offset:2px}[data-tw-on]{outline:2px solid #2f6bff!important;outline-offset:2px}';
  doc.head.appendChild(st);
  doc.addEventListener('mouseover', e=>{ e.target.setAttribute('data-tw-hover',''); });
  doc.addEventListener('mouseout', e=>{ e.target.removeAttribute('data-tw-hover'); });
  doc.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); }, true);
  doc.addEventListener('pointerdown', startDrag, true);
  $('selName').textContent = '요소를 클릭하세요'; $('selPath').textContent = '';
  ['gText','gImg','gBox'].forEach(g=>$(g).hidden = true);
  render();
}

function selectorOf(el){
  if(el.id) return '#' + el.id;
  const parts = [];
  while(el && el.nodeType === 1 && el.tagName !== 'BODY' && el.tagName !== 'HTML'){
    let s = el.tagName.toLowerCase();
    const cls = [...el.classList].filter(c=>!c.startsWith('tw-'));
    if(cls.length) s += '.' + cls.join('.');
    const sib = el.parentElement ? [...el.parentElement.children].filter(c=>c.tagName===el.tagName) : [];
    if(sib.length > 1) s += ':nth-of-type(' + (sib.indexOf(el)+1) + ')';
    parts.unshift(s);
    if(el.id){ parts[0] = '#' + el.id; break; }
    el = el.parentElement;
    if(parts.length >= 3) break;
  }
  return parts.join(' > ');
}
function describe(el){
  const t = (el.textContent||'').trim().replace(/\s+/g,' ').slice(0,20);
  return el.tagName === 'IMG' ? '이미지(' + (el.getAttribute('src')||'').split('/').pop() + ')' : (t ? '"' + t + '"' : el.tagName.toLowerCase());
}
function hex(rgb){ const m = rgb.match(/\d+(\.\d+)?/g); return m ? '#' + m.slice(0,3).map(n=>(+n|0).toString(16).padStart(2,'0')).join('') : '#000000'; }

function read(el){
  const cs = view.contentWindow.getComputedStyle(el), fs = parseFloat(cs.fontSize);
  return {
    'font-size':fs, 'font-weight':+cs.fontWeight,
    'letter-spacing': cs.letterSpacing==='normal'?0:parseFloat(cs.letterSpacing),
    'line-height': cs.lineHeight==='normal'?1.2:+(parseFloat(cs.lineHeight)/fs).toFixed(2),
    'color':hex(cs.color),
    'width':parseFloat(cs.width)||0,'height':parseFloat(cs.height)||0,
    'border-radius':parseFloat(cs.borderTopLeftRadius)||0,'opacity':+cs.opacity,
    'left': parseFloat(el.style.left)||0, 'top': parseFloat(el.style.top)||0
  };
}
function remember(el){ if(!orig.has(el)) orig.set(el, {v:read(el), sel:selectorOf(el), name:describe(el), text:el.textContent, src:el.getAttribute('src')}); }
const fmt = (p,v) => p.type==='color' ? v : v + p.unit;

function buildControls(box, props, el){
  box.innerHTML = '';
  const now = read(el);
  props.forEach(p=>{
    const row = document.createElement('label'); row.className = 'row';
    const v = now[p.k];
    row.innerHTML = '<span>'+p.label+'</span>' + (p.type==='color'
      ? '<input type="color" value="'+v+'"><output></output>'
      : '<input type="range" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+v+'"><output>'+fmt(p,v)+'</output>');
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.addEventListener('input', ()=>{
      if(p.k==='left'||p.k==='top'){ if(view.contentWindow.getComputedStyle(el).position==='static') el.style.position='relative'; }
      el.style.setProperty(p.k, fmt(p, inp.value));
      if(p.type!=='color') out.textContent = fmt(p, inp.value);
      render();
    });
    box.appendChild(row);
  });
}

function select(el){
  if(cur) cur.removeAttribute('data-tw-on');
  cur = el; el.setAttribute('data-tw-on','');
  remember(el);
  $('selName').textContent = describe(el);
  $('selPath').textContent = orig.get(el).sel;
  const isImg = el.tagName === 'IMG';
  const hasText = !isImg && el.children.length === 0 && el.textContent.trim().length > 0;
  $('gText').hidden = isImg;
  $('gImg').hidden = !isImg;
  $('gBox').hidden = false;
  if(!isImg){ buildControls($('textControls'), TEXT_PROPS, el); }
  if(isImg){ buildControls($('imgControls'), IMG_PROPS, el); }
  buildControls($('boxControls'), BOX_PROPS, el);
  const ta = $('textEdit');
  ta.disabled = !hasText; ta.value = hasText ? el.textContent : '';
  ta.placeholder = hasText ? '' : '안에 다른 요소가 있어서 여기선 문구를 못 바꿔요. 더 안쪽 글자를 클릭하세요.';
}

$('textEdit').addEventListener('input', e=>{ if(cur){ cur.textContent = e.target.value; render(); } });

/* 드래그 이동 */
function startDrag(e){
  const el = e.target;
  if(el === doc.body || el === doc.documentElement) return;
  e.preventDefault();
  select(el);
  const sx = e.clientX, sy = e.clientY, st = read(el);
  let moved = false;
  const move = ev=>{
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if(!moved && Math.abs(dx)+Math.abs(dy) < 4) return;
    moved = true;
    if(view.contentWindow.getComputedStyle(el).position==='static') el.style.position='relative';
    el.style.left = Math.round(st.left + dx) + 'px';
    el.style.top  = Math.round(st.top + dy) + 'px';
    render();
  };
  const up = ()=>{ doc.removeEventListener('pointermove', move); doc.removeEventListener('pointerup', up); if(moved) select(el); };
  doc.addEventListener('pointermove', move); doc.addEventListener('pointerup', up);
}

/* 이미지 교체·추가·삭제 */
function readFile(f){ return new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(f); }); }
$('swapImg').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f || !cur) return;
  cur.src = await readFile(f);
  ops = ops.filter(o=>!(o.type==='swap' && o.el===cur));
  ops.push({type:'swap', el:cur, file:f.name});
  e.target.value=''; render();
});
$('addImg').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f || !cur) return;
  const img = doc.createElement('img');
  img.src = await readFile(f); img.alt = ''; img.style.maxWidth = '100%'; img.style.display = 'block';
  cur.insertAdjacentElement('afterend', img);
  ops.push({type:'add', el:img, after:orig.get(cur).sel, afterName:orig.get(cur).name, file:f.name});
  e.target.value=''; select(img); render();
});
$('del').addEventListener('click', ()=>{
  if(!cur) return;
  const added = ops.find(o=>o.type==='add' && o.el===cur);
  if(added){ ops = ops.filter(o=>o!==added); }
  else ops.push({type:'del', sel:orig.get(cur).sel, name:orig.get(cur).name});
  cur.remove(); orig.delete(cur); cur = null;
  ['gText','gImg','gBox'].forEach(g=>$(g).hidden = true);
  $('selName').textContent = '요소를 클릭하세요'; $('selPath').textContent = '';
  render();
});

/* 결과 문장 만들기 */
function render(){
  const cssBlocks = [], htmlLines = [];
  const all = [...TEXT_PROPS, ...IMG_PROPS, ...BOX_PROPS];
  orig.forEach((o, el)=>{
    if(!el.isConnected || ops.some(x=>x.type==='add' && x.el===el)) return;
    const n = read(el), lines = [];
    all.forEach(p=>{
      if(!el.style.getPropertyValue(p.k)) return;
      const a = o.v[p.k], b = n[p.k];
      if(p.type==='color' ? a!==b : Math.abs(a-b) > 0.001) lines.push('  '+p.k+': '+fmt(p,b)+';  /* 원래 '+fmt(p,a)+' */');
    });
    if(lines.length && (el.style.left||el.style.top) && el.style.position==='relative') lines.unshift('  position: relative;');
    if(lines.length) cssBlocks.push(o.sel + ' {  /* ' + o.name + ' */\n' + lines.join('\n') + '\n}');
    if(el.tagName!=='IMG' && el.children.length===0 && el.textContent !== o.text)
      htmlLines.push('- ' + o.sel + ' 의 문구를 "' + el.textContent.trim() + '" 로 바꿔줘. (원래: "' + o.text.trim() + '")');
  });
  ops.forEach(o=>{
    if(o.type==='swap') htmlLines.push('- ' + orig.get(o.el).sel + ' 이미지를 images/' + o.file + ' 로 교체해줘. (원래: ' + orig.get(o.el).src + ') ※ 파일은 내가 images 폴더에 넣어둘게.');
    if(o.type==='add')  htmlLines.push('- ' + o.after + ' (' + o.afterName + ') 바로 아래에 images/' + o.file + ' 이미지를 추가해줘. ※ 파일은 내가 images 폴더에 넣어둘게.');
    if(o.type==='del')  htmlLines.push('- ' + o.sel + ' (' + o.name + ') 요소를 삭제해줘.');
  });
  const out = $('out');
  if(!cssBlocks.length && !htmlLines.length){ out.textContent = '아직 바꾼 게 없어요.'; out.classList.add('empty'); return; }
  out.classList.remove('empty');
  let t = fileName + ' 을 아래대로 수정해줘. 말한 것 말고는 건드리지 마.\n';
  if(cssBlocks.length) t += '\n[CSS 변경]\n' + cssBlocks.join('\n\n') + '\n';
  if(htmlLines.length) t += '\n[HTML 변경]\n' + htmlLines.join('\n') + '\n';
  t += '\n수정 끝나면 바뀐 부분 요약하고 커밋해줘.';
  out.textContent = t;
}

$('copy').onclick = async ()=>{
  const t = $('out').textContent, toast = $('toast');
  try{ await navigator.clipboard.writeText(t); toast.textContent = '복사됨. Claude Code에 붙여넣으세요.'; }
  catch{ const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
         toast.textContent = '자동 복사가 막혔어요. 선택된 글을 Ctrl/Cmd+C로 복사하세요.'; }
  setTimeout(()=>toast.textContent='', 3000);
};
$('reset').onclick = ()=>{ if(confirm('바꾼 걸 전부 되돌릴까요?')) load(lastHtml, fileName); };

let lastHtml = SAMPLE;
$('openHtml').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader(); fr.onload = ()=>{ lastHtml = fr.result; load(lastHtml, f.name); }; fr.readAsText(f);
  e.target.value='';
});
$('loadSample').onclick = ()=>{ lastHtml = SAMPLE; load(SAMPLE, 'index.html'); };
load(SAMPLE, 'index.html');
</script>
</body>
